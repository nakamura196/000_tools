[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iiif-image-downloader"
version = "1.0.0"
description = "Bulk image download from IIIF manifests (Presentation API 2.x / 3.0)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Satoru Nakamura" }]
keywords = ["iiif", "digital-humanities", "digital-archives", "image"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "requests>=2.26",
  "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/nakamura196/000_tools"
Source = "https://github.com/nakamura196/000_tools/tree/main/packages/iiif-image-downloader"

[project.scripts]
iiif-image-download = "iiif_image_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iiif_image_downloader = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional for Python 3.9
